services:
  - type: web
    name: ai-budget-expense-advisor
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # --- Required secrets: set these manually in the Render dashboard ---
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # --- Optional with sensible defaults ---
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "False"
      - key: CHROMA_DB_DIR
        value: "./vector_store/chroma_db"
      - key: CHROMA_COLLECTION_NAME
        value: "expense_vectors"
