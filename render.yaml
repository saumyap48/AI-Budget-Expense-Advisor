services:
  - type: web
    name: ai-budget-expense-advisor
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head || echo "WARNING: alembic migration step skipped (DATABASE_URL may not be configured yet - set it in Render Dashboard)"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # -----------------------------------------------------------------------
      # Required secrets: must be set manually in the Render Dashboard
      # -----------------------------------------------------------------------
      - key: DATABASE_URL
        sync: false   # Paste your Render PostgreSQL Internal Database URL here
      - key: SECRET_KEY
        sync: false   # Any long random string (e.g. openssl rand -hex 32)
      - key: GEMINI_API_KEY
        sync: false   # Your Google AI Studio API key
      # -----------------------------------------------------------------------
      # Optional — sensible production defaults (override in Dashboard if needed)
      # -----------------------------------------------------------------------
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "False"
      - key: CHROMA_DB_DIR
        value: "./vector_store/chroma_db"
      - key: CHROMA_COLLECTION_NAME
        value: "expense_vectors"
