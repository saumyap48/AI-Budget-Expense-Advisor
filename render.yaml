services:
  - type: web
    name: ai-budget-expense-advisor
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip uninstall -y bcrypt passlib || true
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
